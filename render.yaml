services:
  - type: web
    name: sts2-advisor
    runtime: python
    repo: https://github.com/yourusername/sts2-advisor
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: STS2_MODE
        value: cloud
      - key: STS2_DB_PATH
        value: /tmp/sts2_cloud.db
      - key: FLASK_SECRET_KEY
        generateValue: true
